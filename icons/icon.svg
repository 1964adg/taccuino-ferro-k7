<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona di Gaia Gym: manubrio bianco su sfondo viola sfumato.
       Lo sfondo copre tutto il quadrato: iOS e Android arrotondano da soli gli angoli. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B7CF6"/>
      <stop offset="1" stop-color="#5B47E0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="420" cy="92" r="150" fill="#ffffff" opacity="0.08"/>
  <g fill="#ffffff">
    <!-- Barra -->
    <rect x="150" y="242" width="212" height="28" rx="14"/>
    <!-- Dischi sinistri -->
    <rect x="96" y="176" width="44" height="160" rx="18"/>
    <rect x="62" y="206" width="30" height="100" rx="14"/>
    <!-- Dischi destri -->
    <rect x="372" y="176" width="44" height="160" rx="18"/>
    <rect x="420" y="206" width="30" height="100" rx="14"/>
  </g>
</svg>
